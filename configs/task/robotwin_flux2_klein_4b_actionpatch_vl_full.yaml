# @package _global_
# action-as-patch + 冻结图像 grounded Qwen3-VL 文本编码器,RoboTwin 全量 no-op 过滤数据。
# 除 model(text encoder = VL)外,所有超参与 robotwin_flux2_klein_4b_actionpatch_full 逐项一致,
# 以便逐 ckpt 公平对比。4 nodes x 8 GPUs, global batch 256。

defaults:
  - override /data: robotwin_omnigen2
  - override /model: imagewam_flux2_klein_4b_actionpatch_vl
  - _self_

data:
  train:
    dataset_dirs:
      - /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0
    pretrained_norm_stats: /storage/yukaichengLab/share/datasets/fastwam_robotwin/dataset_stats.json
    require_text_cache: false
    qwen_text_cache_dir: null
    nonidle_filter_path: /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0/nonidle_ranges.json
  val:
    dataset_dirs:
      - /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0
    pretrained_norm_stats: /storage/yukaichengLab/share/datasets/fastwam_robotwin/dataset_stats.json
    require_text_cache: false
    qwen_text_cache_dir: null
    nonidle_filter_path: /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0/nonidle_ranges.json

# global batch = batch_size(4) * grad_accum(2) * (4 nodes * 8 gpus = 32) = 256 —— 与 patch 完全一致
batch_size: 4
num_workers: 16
prefetch_factor: 2
persistent_workers: true
keep_latest_state_only: true

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 5000
eval_every: 9999999

gradient_accumulation_steps: 2
weight_decay: 1e-2
mixed_precision: "bf16"
resume: null

wandb:
  enabled: true
  project: imagewam
  name: robotwin_flux2_klein_4b_actionpatch_vl_full
