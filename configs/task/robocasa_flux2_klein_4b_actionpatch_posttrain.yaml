# @package _global_
# RoboCasa365 POST-TRAIN: fine-tune the pretrained action-as-patch checkpoint on ONE
# target split (500 human demos/task). Launch once per split:
#
#   TASK=robocasa_flux2_klein_4b_actionpatch_posttrain \
#   bash scripts/flux2/train_flux2_klein_imagewam.sh 8 \
#     +data/robocasa365_target_atomic_dirs@data.train=default \
#     +data/robocasa365_target_atomic_dirs@data.val=default \
#     resume=<pretrain runs/.../checkpoints/state/step_XXXXXX> \
#     wandb.name=robocasa_ap_posttrain_atomic
#
# Split dirs files (generated by experiments/robocasa/gen_dirs.sh):
#   robocasa365_target_atomic_dirs.yaml           (18 atomic-seen tasks)
#   robocasa365_target_composite_seen_dirs.yaml   (16 tasks; needs the official seen list)
#   robocasa365_target_composite_unseen_dirs.yaml (16 tasks; needs the official unseen list)

defaults:
  - override /data: robocasa365
  - override /model: imagewam_flux2_klein_4b_actionpatch
  - _self_

batch_size: 12
num_workers: 16
prefetch_factor: 2
persistent_workers: true
keep_latest_state_only: true

lr_scheduler_type: "cosine"
learning_rate: 5e-5   # post-train: half the pretrain lr (common fine-tune practice)
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 100000

gradient_accumulation_steps: 1
weight_decay: 1e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: true
  project: imagewam
  name: robocasa_flux2_klein_4b_actionpatch_posttrain
