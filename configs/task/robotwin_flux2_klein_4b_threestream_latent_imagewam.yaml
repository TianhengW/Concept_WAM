# @package _global_
# Three-stream (image + text + action) FLUX.2 + LatentReasoner on RoboTwin.
# Data setup aligned to the original ImageWAM release (full RoboTwin episodes,
# endpoint_frames_only, num_frames=17). The ~921k unique instructions make a
# precomputed qwen text cache infeasible; text is produced online by the
# LatentReasoner (Qwen3 Coconut, 16 latent tokens).

defaults:
  - override /data: robotwin_omnigen2
  - override /model: imagewam_flux2_klein_4b_threestream_latent
  - _self_

data:
  train:
    dataset_dirs:
      - /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0
    pretrained_norm_stats: /storage/yukaichengLab/share/datasets/fastwam_robotwin/dataset_stats.json
    require_text_cache: false
    qwen_text_cache_dir: null
    # non-idle range filter (kept_rate 89.29%) - drops idle sub-trajectories.
    nonidle_filter_path: /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0/nonidle_ranges.json
  val:
    dataset_dirs:
      - /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0
    pretrained_norm_stats: /storage/yukaichengLab/share/datasets/fastwam_robotwin/dataset_stats.json
    require_text_cache: false
    qwen_text_cache_dir: null
    nonidle_filter_path: /storage/yukaichengLab/share/datasets/fastwam_robotwin/robotwin2.0/nonidle_ranges.json

# global batch = batch_size(4) * grad_accum(2) * (4 nodes * 8 gpus = 32) = 256
batch_size: 4
num_workers: 16
prefetch_factor: 2
persistent_workers: true
keep_latest_state_only: true

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

gradient_accumulation_steps: 2
weight_decay: 1e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: true
  project: imagewam
  name: robotwin_flux2_klein_4b_threestream_latent
