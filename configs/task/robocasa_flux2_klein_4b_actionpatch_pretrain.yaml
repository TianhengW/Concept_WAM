# @package _global_
# RoboCasa365 PRETRAIN (Human300): action-as-patch on the 300 pretraining tasks
# (65 atomic + 235 composite, ~100 human demos each). Standard benchmark recipe:
# pretrain here, then post-train per target split, then evaluate on 50 target tasks.
# dataset_dirs come from configs/data/robocasa365_pretrain_dirs.yaml (generated by
# experiments/robocasa/gen_dirs.sh; excludes the MimicGen mg/ roots).
# 4 nodes x 8 GPUs, DDP (ZERO_STAGE=0 on diguayun), batch tuned for >=80% of 140G.

defaults:
  - /data/robocasa365_pretrain_dirs@data.train
  - /data/robocasa365_pretrain_dirs@data.val
  - override /data: robocasa365
  - override /model: imagewam_flux2_klein_4b_actionpatch
  - _self_

# batch 32 OOMd at step1 (137/140GiB even w/ expandable_segments); 24 = ~82% w/ headroom.
batch_size: 24
num_workers: 16
prefetch_factor: 2
persistent_workers: true
keep_latest_state_only: true

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 5000
eval_every: 100000

gradient_accumulation_steps: 1
weight_decay: 1e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: true
  project: imagewam
  name: robocasa_flux2_klein_4b_actionpatch_pretrain
