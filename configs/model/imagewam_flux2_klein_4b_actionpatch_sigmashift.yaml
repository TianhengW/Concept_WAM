_target_: exploration.action_img_patch.factory.create_imagewam_flux2_klein_actionpatch_sigmashift

# Scheme B (H3 dual-schedule study): identical to
# imagewam_flux2_klein_4b_actionpatch except the action tokens run a relative
# sigma shift inside the joint denoise: sigma_a = phi(sigma_v, ratio), so the
# effective action shift is 5.0 * ratio (H3 uses audio 3.0 vs video 12.0, i.e.
# ratio 0.25). ratio = 1.0 degenerates exactly to the baseline. Per-token
# noise level is conditioned via timestep_per_token. Zero new parameters.

flux2_model_path: /storage/yukaichengLab/share/model/FLUX.2-klein-base-4B/flux-2-klein-base-4b.safetensors
ae_model_path: /storage/yukaichengLab/share/model/FLUX.2-dev/ae.safetensors
flux2_src_path: /storage/yukaichengLab/mazijian/wth/flux2
variant: klein-base-4b

qwen3_model_spec: /storage/yukaichengLab/share/model/Qwen3-4B
qwen_context_len: 128
load_text_encoder: true

proprio_dim: ${data.train.processor.proprio_output_dim}
pack_proprio_after_text: true

mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false

action_patch_dim: ${data.train.processor.action_output_dim}
action_patch_scale: 1.0
action_shift_ratio: 0.25

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.5
  lambda_action: 1.0
